# fly.toml generated by user for js_astro API
app = "js-astro-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  memory_swap = "256mb"